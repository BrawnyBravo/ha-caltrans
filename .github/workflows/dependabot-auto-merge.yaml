name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto_merge:
    name: Auto-merge patch and minor updates
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Needs the repo setting "Allow auto-merge" plus a ruleset on main that
      # requires the Linting, HACS, Hassfest and Run tests checks. Without the
      # ruleset a PR can merge before CI finishes. Majors are left for review.
      - name: Enable auto-merge (squash)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
