repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: end-of-file-fixer
        # Real feed sample kept byte for byte (non-UTF-8, no final newline).
        exclude: ^tests/fixtures/d11_cc_cp1252.json$
      - id: trailing-whitespace
  # Ruff runs from the copy pinned in requirements.txt, so its version lives in
  # exactly one place and Dependabot's bump of that file is the whole upgrade.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --force-exclude --fix --unsafe-fixes
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
